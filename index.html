<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e31b23">
  <title>ONLY1NAME</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <a class="brand" href="./">
      <span class="brand-one">1</span>
      ONLY1NAME
    </a>

    <button
      id="sound-toggle"
      class="sound-button"
      aria-label="Toggle sound"
      type="button"
    >
      🔊
    </button>
  </header>


  <main class="app-shell">

    <!-- ======================================================
         HOME / LEVEL SELECT
         ====================================================== -->

    <section
      id="home-screen"
      class="screen home-screen"
    >

      <div class="name-sticker">
        <div class="sticker-top">HELLO</div>
        <div class="sticker-title">MY NAME IS</div>
        <div class="sticker-name">HOF</div>
      </div>


      <div class="home-heading">
        <h1>ONLY<span>1</span>NAME</h1>
        <p>Pick a level.</p>
      </div>


      <div
        id="levels-grid"
        class="levels-grid"
      ></div>


      <div class="home-progress">
        <span id="home-progress-text">
          0 / 0 LEVELS COMPLETE
        </span>

        <div class="home-progress-track">
          <div id="home-progress-bar"></div>
        </div>
      </div>


      <button
        id="reset-progress-button"
        class="reset-progress-button"
        type="button"
      >
        RESET PROGRESS
      </button>

    </section>


    <!-- ======================================================
         GAME
         ====================================================== -->

    <section
      id="game-screen"
      class="screen game-screen hidden"
    >

      <div class="game-topbar">

        <button
          id="home-button"
          class="back-button"
          type="button"
        >
          ← LEVELS
        </button>


        <div class="level-indicator">
          LEVEL
          <strong id="level-number">01</strong>
        </div>


        <div class="round-indicator">
          <strong id="round-number">1</strong>
          /
          <span id="round-total">4</span>
        </div>

      </div>


      <div class="name-card-wrapper">

        <div class="name-card">

          <div class="name-card-header">
            <div class="my-name-text">HELLO, MY NAME IS</div>
          </div>


          <div class="card-photo-area">

            <img
              id="contestant-photo"
              alt="Contestant"
              draggable="false"
            >


            <div
              id="photo-fallback"
              class="photo-fallback hidden"
            >
              ?
            </div>


            <!-- Level-start countdown -->
            <div
              id="countdown-overlay"
              class="countdown-overlay hidden"
            >
              <span id="countdown-number">3</span>
            </div>


            <!-- Answer -->
            <div
              id="reveal-overlay"
              class="reveal-overlay hidden"
            >
              <div
                id="reveal-name"
                class="answer-name"
              ></div>
            </div>

          </div>


          <div class="name-card-footer">

            <span class="card-star">★</span>

            <div class="timer-area">

              <div class="timer-display">
                <span id="timer-display">10</span>s
              </div>

              <div class="timer-track">
                <div id="timer-bar"></div>
              </div>

            </div>

            <span class="card-star">★</span>

          </div>

        </div>

      </div>


      <!-- Only Previous / Next -->
      <div class="game-controls">

        <div class="navigation">

          <button
            id="previous-button"
            class="nav-button"
            type="button"
          >
            ← PREVIOUS
          </button>


          <button
            id="next-button"
            class="nav-button next"
            type="button"
          >
            NEXT →
          </button>

        </div>

      </div>


      <div class="level-status">

        <span>
          LEVEL
          <strong id="status-level">01</strong>
        </span>

        <span>
          <strong id="level-total">4</strong>
          PICTURES
        </span>

      </div>

    </section>

  </main>


  <footer class="site-footer">
    ONLY1NAME
  </footer>


  <script src="game.js"></script>

</body>
</html>
